version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns:
          - firebase
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Stay on TypeScript 6.0 until the app is moved on deliberately.
      - dependency-name: typescript
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # Keep @types/node on the Node version in .nvmrc; move them together.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
